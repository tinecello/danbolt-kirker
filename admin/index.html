<style>
body{margin:0;background:#f4f5f3;color:#25211f;font-family:'Manrope',sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:400;margin:0}
h1{font-size:40px!important}h2{font-size:30px}h3{font-size:24px}
p{margin:0}
[hidden]{display:none!important}
button,.a-knapp{font:600 15px 'Manrope',sans-serif;border:1px solid #aaa69e;background:#fff;color:#25211f;padding:10px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;box-sizing:border-box}
button:disabled{opacity:.5;cursor:default}
button.a-hoved{background:#61554c;color:#fff;border-color:#61554c}

input,textarea,select{font:400 16px 'Manrope',sans-serif;color:#25211f;padding:10px 12px;width:100%;box-sizing:border-box;min-height:44px}
textarea{min-height:76px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;flex:none}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
label.a-kryss{flex-direction:row;align-items:center;gap:10px;font-weight:500;font-size:15px}
.a-dempet{color:#61554c;font-size:14px}
.a-inn{max-width:860px;margin:0 auto;padding:0 16px}
#app>header{background:#25211f;color:#f4f5f3}

#app>header select{flex:1 1 200px;width:auto}
#app>header b{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;margin-right:auto}
label.a-knapp{position:relative;flex-direction:row}
.a-fil{position:absolute;opacity:0;width:1px;height:1px;min-height:0;padding:0}
#nyavbryt{background:#fff}
#faner{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid #d4d3ce;position:sticky;top:0;background:#f4f5f3;z-index:5}

main{padding:24px 0 120px;display:flex;flex-direction:column;gap:22px}
.a-rad{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}

.kat-lyd{background:#a8432a;fill:#a8432a}.kat-lys{background:#8f6512;fill:#8f6512}.kat-praktisk{background:#3f6b5a;fill:#3f6b5a}

dialog{border:0;padding:20px;max-width:min(92vw,460px);width:100%;box-sizing:border-box}
dialog::backdrop{background:#25211fb0}
#inn{max-width:420px;margin:12vh auto 0;padding:0 20px;display:flex;flex-direction:column;gap:16px}

</dialog>

<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
var KAT = { lyd: 'Lyd', lys: 'Lys', praktisk: 'Praktisk' };
var pw = '', kirker = [], slug = '', D = null, sha = '', lenke = '', panelLenke = '', skitten = false, fane = 'bilder';
var lokale = {};          // nyopplastede bilder vises fra enheten til siden er bygget på nytt
var valgtPunkt = null, valgtMerke = null, apne = {};

// ---------- små hjelpere ----------
function h(tag, attr) {
  var e = document.createElement(tag), i, k;
  for (k in attr || {}) {
    if (k === 'on') for (i in attr.on) e.addEventListener(i, attr.on[i]);
    else if (k === 'text') e.textContent = attr[k];
    else if (attr[k] === true) e.setAttribute(k, '');
    else if (attr[k] !== false && attr[k] != null) e.setAttribute(k, attr[k]);
  }
  for (i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
  return e;
}
function s(tag, attr) {
  var e = document.createElementNS('http://www.w3.org/2000/svg', tag), i;
  for (var k in attr || {}) e.setAttribute(k, attr[k]);
  for (i = 2; i < arguments.length; i++) e.append(arguments[i]);
  return e;
}
function status(t) { $('status').textContent = t; }
function merk() { skitten = true; status('Endringer er ikke lagret.'); }
function api(handling, ekstra) {
  return fetch('/api/admin', { method: 'POST', headers: { 'content-type': 'application/json', 'x-passord': pw }, body: JSON.stringify(Object.assign({ handling: handling }, ekstra)) })
    .then(function (r) { return r.json().catch(function () { return { feil: 'Uventet svar fra serveren.' }; }).then(function (j) { if (!r.ok) { var f = new Error(j.feil || 'Noe gikk galt.'); f.status = r.status; throw f; } return j; }); });
}

// Tekstfelt bundet rett til dataene.
function felt(obj, key, etikett, valg) {
  valg = valg || {};
  var inn = h(valg.lang ? 'textarea' : 'input', { placeholder: valg.hint || null });
  inn.value = obj[key] == null ? '' : obj[key];
  inn.addEventListener('input', function () { obj[key] = inn.value; merk(); });
  return h('label', {}, etikett, inn);
}
// Liste der man kan legge til, fjerne og flytte.
function liste(arr, lag, ny, leggTil) {
  var boks = h('div', { class: 'a-kol' });
  arr.forEach(function (x, i) {
    var kort = h('div', { class: 'a-kort' });
    lag(x, i).forEach(function (n) { kort.append(n); });
    kort.append(h('div', { class: 'a-flex' },
      h('button', { type: 'button', class: 'a-liten', disabled: i === 0, text: '↑ Flytt opp', on: { click: function () { arr.splice(i - 1, 0, arr.splice(i, 1)[0]); merk(); tegn(); } } }),
      h('button', { type: 'button', class: 'a-liten a-fare', text: 'Fjern', on: { click: function () { if (confirm('Fjerne denne?')) { arr.splice(i, 1); merk(); tegn(); } } } })));
    boks.append(kort);
  });
  boks.append(h('button', { type: 'button', text: '+ ' + leggTil, on: { click: function () { arr.push(ny()); merk(); tegn(); } } }));
  return boks;
}
function del(id, tittel) {
  var d = h('details', { class: 'a-del', open: !!apne[id] }, h('summary', { text: tittel }));
  d.addEventListener('toggle', function () { apne[id] = d.open; });
  var inni = h('div'); d.append(inni);
  for (var i = 2; i < arguments.length; i++) if (arguments[i]) inni.append(arguments[i]);
  return d;
}

// ---------- bilder ----------
function krymp(fil, maks) {
  return new Promise(function (ok, feil) {
    var url = URL.createObjectURL(fil), img = new Image();
    img.onload = function () {
      var f = Math.min(1, maks / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * f); c.height = Math.round(img.naturalHeight * f);
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (blob) {
        if (!blob) return feil(new Error('Klarte ikke å lese bildet.'));
        var les = new FileReader();
        les.onload = function () { ok({ b64: String(les.result).split(',')[1], url: URL.createObjectURL(blob), w: c.width, h: c.height }); };
        les.readAsDataURL(blob);
      }, 'image/jpeg', 0.82);
    };
    img.onerror = function () { URL.revokeObjectURL(url); feil(new Error('Klarte ikke å lese bildet. Prøv et JPEG- eller PNG-bilde.')); };
    img.src = url;
  });
}
// Laster opp og lagrer med en gang. navn blir filnavnet i bilder/<kirke>/.
function lastOpp(fil, navn, maks) {
  status('Laster opp bilde …');
  return krymp(fil, maks || 1600).then(function (b) {
    return api('bilde', { slug: slug, navn: navn + '-' + Date.now().toString(36), data: b.b64 }).then(function (r) { lokale[r.src] = b.url; b.src = r.src; return b; });
  });
}
function vis(src) { return lokale[src] || src; }
function bildeplass(b, navn, etikett, etter) {
  // Fjernet plass: vises ikke på kirkesiden. Kan tas tilbake.
  if (b.skjul) return h('div', { class: 'a-flex a-dempet' }, h('span', { style: 'flex:1 1 180px', text: etikett + (b.tekst ? ': ' + b.tekst : '') }),
    h('button', { type: 'button', class: 'a-liten', text: 'Ta tilbake', on: { click: function () { delete b.skjul; merk(); tegn(); } } }));
  var fil = h('input', { type: 'file', accept: 'image/*', class: 'a-fil' });
  var knapp = h('label', { class: 'a-knapp', tabindex: 0 }, b.src ? 'Bytt bilde' : 'Ta bilde eller velg', fil);
  fil.addEventListener('change', function () {
    if (!fil.files[0]) return;
    lastOpp(fil.files[0], navn).then(function (r) { b.src = r.src; if (etter) etter(r); return lagre('bilde lagt inn'); }).then(tegn)
      .catch(function (f) { status(f.message); });
  });
  var tekst = h('input', { 'aria-label': 'Hva bildet viser', placeholder: 'Hva bildet viser' });
  tekst.value = b.tekst || '';
  tekst.addEventListener('input', function () { b.tekst = tekst.value; merk(); });
  return h('div', { class: 'a-bilde' },
    h('div', { class: 'a-mini' + (b.src ? ' har' : '') }, b.src ? h('img', { src: vis(b.src), alt: '' }) : 'Mangler'),
    h('div', { class: 'a-kol' },
      h('b', { text: etikett }), tekst,
      h('div', { class: 'a-flex' }, knapp,
        h('button', { type: 'button', class: 'a-liten a-fare', text: 'Fjern', on: { click: function () {
          if (b.src && !confirm('Fjerne dette bildet fra kirkesiden?')) return;
          b.src = ''; b.skjul = true; merk(); tegn(); } } }))));
}
function alleBilder() {
  var ut = [];
  var legg = function (gruppe, b, navn, etikett) { if (b) ut.push({ gruppe: gruppe, b: b, navn: navn, etikett: etikett }); };
  if (!D.hovedbilde) D.hovedbilde = { src: '', tekst: 'Kirkerommet' };
  legg('Forsiden', D.hovedbilde, 'hovedbilde', 'Hovedbilde');
  (D.oppgaver || []).forEach(function (o) { (o.steg || []).forEach(function (st, j) {
    if (!st.bilde) st.bilde = { src: '', tekst: '' };
    legg('Kom i gang: ' + o.tittel, st.bilde, (o.id || 'oppgave') + '-steg', 'Steg ' + (j + 1));
  }); });
  if (D.panel) { legg('Panelet', D.panel.ui, 'panel-skjerm', 'Skjermbildet på panelet'); legg('Panelet', D.panel.bilde, 'panel-foto', 'Foto av panelet'); }
  if (D.lys) legg('Lys', D.lys.bilde, 'lys', 'Lysbryterne');
  if (D.teknisk) legg('Teknisk', D.teknisk.bilde, 'teknisk', 'Teknisk utstyr');
  (D.galleri || []).forEach(function (g, i) { if (!g.video) legg('Flere bilder', g, 'ekstra', 'Ekstra bilde ' + (i + 1)); });
  return ut;
}

// Lenke som bare kan laste opp skjermbildet av styringspanelet. Kan sendes til den som står ved panelet.
function panelLenkeBoks() {
  var full = location.origin + panelLenke, inn = h('input', { readonly: true, value: full, 'aria-label': 'Lenke for opplasting av skjermbilde' });
  return h('div', { class: 'a-kort' }, h('b', { text: 'Lenke for opplasting av skjermbildet' }),
    h('p', { class: 'a-dempet', text: 'Den som åpner lenken, kan laste opp skjermbildet av styringspanelet for ' + D.navn + ', og ingenting annet. Krever ikke passord.' }), inn,
    h('div', { class: 'a-flex' },
      h('button', { type: 'button', text: 'Kopier lenken', on: { click: function (e) { navigator.clipboard.writeText(full).then(function () { e.target.textContent = 'Kopiert'; }, function () { inn.select(); }); } } }),
      h('a', { class: 'a-knapp', href: panelLenke, target: '_blank', rel: 'noopener', text: 'Åpne' })));
}

// ---------- faner ----------
var FANER = [['bilder', 'Bilder'], ['plan', 'Plantegning'], ['panel', 'Panel'], ['tekst', 'Tekster'], ['lenke', 'Kirkens lenke']];
function tegnFaner() {
  $('faner').replaceChildren.apply($('faner'), FANER.map(function (f) {
    return h('button', { type: 'button', role: 'tab', 'aria-selected': fane === f[0], text: f[1], on: { click: function () { fane = f[0]; tegnFaner(); tegn(); } } });
  }));
}
function tegn() {
  var m = $('innhold'), y = window.scrollY;
  m.replaceChildren();
  if (!D) return;
  if (D.kommer) {
    m.append(h('h2', { text: D.navn }), h('p', { text: 'Denne kirken står på forsiden som «Side kommer», men har ingen egen side ennå.' }),
      h('button', { class: 'a-hoved', type: 'button', text: 'Opprett siden', on: { click: function () { nyKirke(D.navn, D.sted); } } }),
      h('p', { class: 'a-dempet', text: D.panel && D.panel.ui && D.panel.ui.src ? 'Skjermbildet av styringspanelet er lastet opp og følger med når siden opprettes.' : 'Skjermbildet av styringspanelet er ikke lastet opp ennå.' }), panelLenkeBoks());
    return;
  }
  if (D.skjult) m.append(h('div', { class: 'a-hint a-flex' }, h('span', { style: 'flex:1 1 220px', text: D.paForsiden ? 'Denne kirken er skjult. På forsiden står den som «Side kommer», og bare du ser siden via «Se siden».' : 'Denne kirken er skjult. Den vises ikke på forsiden, og bare du ser den via «Se siden».' }),
    h('button', { type: 'button', text: 'Gjør synlig', on: { click: function () { if (!confirm('Kirkens side blir åpen for alle. Fortsette?')) return; delete D.skjult; delete D.paForsiden; lagre('gjort synlig').then(tegn, function () { D.skjult = true; }); } } })));
  ({ bilder: faneBilder, plan: fanePlan, panel: fanePanel, tekst: faneTekst, lenke: faneLenke })[fane](m);
  window.scrollTo(0, y);
}

function faneBilder(m) {
  var samlet = alleBilder(), alle = samlet.filter(function (x) { return !x.b.skjul; }), fjernet = samlet.filter(function (x) { return x.b.skjul; });
  var inne = alle.filter(function (x) { return x.b.src; }).length, tomme = alle.filter(function (x) { return !x.b.src; }), forrige = '';
  m.append(h('h2', { text: 'Bilder' }), h('p', { class: 'a-dempet', text: inne + ' av ' + alle.length + ' bilder er lagt inn. Bildet lagres og publiseres med en gang du har valgt det. På mobil kan du ta bildet direkte. Bilder og plasser du ikke trenger, fjerner du med «Fjern». Trykk Lagre når du er ferdig.' }));
  if (tomme.length > 1) m.append(h('div', { class: 'a-flex' }, h('button', { type: 'button', text: 'Fjern alle ' + tomme.length + ' plasser uten bilde', on: { click: function () {
    if (!confirm('Fjerne alle ' + tomme.length + ' bildeplasser som ikke har bilde? Du kan ta dem tilbake nederst på siden.')) return;
    tomme.forEach(function (x) { x.b.skjul = true; }); merk(); tegn(); } } })));
  alle.forEach(function (x) {
    if (x.gruppe !== forrige) { m.append(h('h3', { text: x.gruppe })); forrige = x.gruppe; }
    m.append(bildeplass(x.b, x.navn, x.etikett));
  });
  m.append(h('button', { type: 'button', text: '+ Ekstra bilde', on: { click: function () { (D.galleri = D.galleri || []).push({ src: '', tekst: 'Ekstra bilde' }); merk(); tegn(); } } }));
  if (fjernet.length) {
    m.append(h('h3', { text: 'Fjernede bildeplasser' }), h('p', { class: 'a-dempet', text: 'Disse vises ikke på kirkesiden.' }));
    fjernet.forEach(function (x) { m.append(bildeplass(x.b, x.navn, x.gruppe + ', ' + x.etikett)); });
  }
}

function fanePlan(m) {
  var pl = D.plan = D.plan || { w: 30, h: 36, rom: [], etiketter: [], punkter: [] };
  pl.punkter = pl.punkter || [];
  var sk = Math.max(pl.w, pl.h) / 36, pad = 2 * sk, harBilde = pl.bilde && pl.bilde.src, pk = harBilde ? .77 : 1;
  var svg = s('svg', { viewBox: [-pad, -pad, pl.w + pad * 2, pl.h + pad * 2].join(' ') });
  if (harBilde) svg.append(s('image', { href: vis(pl.bilde.src), x: 0, y: 0, width: pl.w, height: pl.h, preserveAspectRatio: 'none' }));
  else {
    (pl.rom || []).forEach(function (r) { svg.append(s('rect', { x: r[0], y: r[1], width: r[2], height: r[3], fill: '#ebe5d9', stroke: '#1d1b17', 'stroke-width': .15 * sk })); });
    (pl.etiketter || []).forEach(function (t) { var e = s('text', { x: t.x, y: t.y, fill: '#8a8274', 'font-size': 1.05 * sk, 'text-anchor': 'middle' }); e.textContent = t.t; svg.append(e); });
  }
  pl.punkter.forEach(function (p, i) {
    if (p.x == null) return;
    var valgt = valgtPunkt === p;
    var t = s('text', { x: p.x, y: p.y + .46 * sk * pk, fill: '#fff', 'font-size': 1.3 * sk * pk, 'font-weight': 600, 'text-anchor': 'middle', 'pointer-events': 'none' }); t.textContent = i + 1;

  pub.addEventListener('change', function () {

          felt(o, 'etter', 'Etter bruk', { lang: true }),

          felt(o.video, 'src', 'Video: lenke', { hint: 'Lim inn YouTube- eller Vimeo-lenke' })];
      }, function () { return { id: 'o' + Date.now().toString(36), tittel: 'Ny oppgave', undertittel: '', steg: [], etter: '' }; }, 'Oppgave')),

    del('tek', 'Teknisk: for lydteknikere',

function faneLenke(m) {

// ---------- lagre og laste ----------
function lagre(hva) {
  $('lagre').disabled = true; status('Lagrer …');
  return api('lagre', { slug: slug, data: D, sha: sha, hva: hva || 'innhold oppdatert' }).then(function (r) {
    sha = r.sha; lenke = r.lenke; panelLenke = r.panelLenke; skitten = false; $('apne').href = r.side;
    var valg = $('velg').selectedOptions[0]; if (valg) valg.textContent = D.navn + (D.skjult ? ' (skjult)' : '');
    status('Lagret ' + new Date().toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' }) + '. Siden er oppdatert om omtrent ett minutt.');
  }).catch(function (f) { status(f.message); throw f; }).finally(function () { $('lagre').disabled = false; });
}
function apneKirke(s) {
  if (skitten && !confirm('Du har endringer som ikke er lagret. Forkaste dem?')) { $('velg').value = slug; return; }
  status('Henter …');
  return api('hent', { slug: s }).then(function (r) {
    slug = s; D = r.data; sha = r.sha; lenke = r.lenke; panelLenke = r.panelLenke; skitten = false; valgtPunkt = valgtMerke = null;
    $('velg').value = s; $('apne').href = r.side; $('apne').hidden = !!D.kommer; $('lagre').hidden = !!D.kommer;
    try { localStorage.setItem('kirke', s); } catch (e) {}
    status(''); tegn();
  }).catch(function (f) { status(f.message); });
}
function hentListe() {
  return api('liste').then(function (r) {
    kirker = r.kirker;
    $('velg').replaceChildren.apply($('velg'), kirker.map(function (k) { return h('option', { value: k.slug, text: k.navn + (k.kommer ? ' (side kommer)' : k.skjult ? ' (skjult)' : '') }); }));
  });
}
function nyKirke(navn, sted) {
  $('nynavn').value = navn || ''; $('nysted').value = sted || ''; $('nyfeil').textContent = ''; $('nyskjult').checked = true;
  $('nyfra').replaceChildren.apply($('nyfra'), kirker.filter(function (k) { return !k.kommer; }).map(function (k) { return h('option', { value: k.slug, text: k.navn }); }).concat(h('option', { value: '', text: 'Tom side' })));
  $('nydialog').showModal();
}

$('velg').addEventListener('change', function () { apneKirke($('velg').value); });
$('ny').addEventListener('click', function () { nyKirke(); });
$('nyavbryt').addEventListener('click', function () { $('nydialog').close(); });
$('nyskjema').addEventListener('submit', function (e) {
  e.preventDefault();
  if (skitten && !confirm('Du har endringer som ikke er lagret. Forkaste dem?')) return;
  skitten = false;
  api('ny', { navn: $('nynavn').value, sted: $('nysted').value, kopierFra: $('nyfra').value, skjult: $('nyskjult').checked }).then(function (r) {
    $('nydialog').close(); return hentListe().then(function () { fane = 'bilder'; tegnFaner(); return apneKirke(r.slug); });
  }).catch(function (f) { $('nyfeil').textContent = f.message; });
});
$('lagre').addEventListener('click', function () { lagre().catch(function () {}); });
window.addEventListener('beforeunload', function (e) { if (skitten) e.preventDefault(); });

function start() {
  return hentListe().then(function () {
    $('inn').hidden = true; $('app').hidden = false; tegnFaner();
    var sist = ''; try { sist = localStorage.getItem('kirke') || ''; } catch (e) {}
    var forste = kirker.filter(function (k) { return k.slug === sist; })[0] || kirker.filter(function (k) { return !k.kommer; })[0] || kirker[0];
    if (forste) return apneKirke(forste.slug);
  });
}
$('innskjema').addEventListener('submit', function (e) {
  e.preventDefault(); pw = $('passord').value; $('innfeil').textContent = '';
  start().then(function () { if ($('husk').checked) { try { localStorage.setItem('adminpw', pw); } catch (e) {} } })
    .catch(function (f) { $('innfeil').textContent = f.message; });
});
try { pw = localStorage.getItem('adminpw') || ''; } catch (e) {}
if (pw) start().catch(function () { pw = ''; try { localStorage.removeItem('adminpw'); } catch (e) {} });
})();
</script>
