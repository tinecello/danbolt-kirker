<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last opp skjermbilde av styringspanelet | Danbolt</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f5f3">
<style>
body{margin:0;background:#f4f5f3;color:#1d1b17;font-family:'Manrope',sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1{font-family:'Cormorant Garamond',serif;font-weight:300;margin:0}
p{margin:0}
main{max-width:640px;margin:0 auto;padding:48px 24px 80px;display:flex;flex-direction:column;gap:22px}
.merk{font-size:14px;font-weight:600;color:#61554c}
.dempet{color:#61554c}
.velg{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:14px 26px;background:#fff;border:1px solid #aaa69e;font-weight:600;cursor:pointer}
.velg input{position:absolute;opacity:0;width:1px;height:1px}
#send{font:600 17px 'Manrope',sans-serif;color:#fff;background:#61554c;border:0;min-height:56px;padding:14px 30px;cursor:pointer}
#send:disabled{opacity:.5;cursor:default}
#vis{max-width:100%;border:6px solid #25211f;background:#111}
.boks{background:#e7e8e5;padding:16px 18px}
.boks.feil{background:#f3dcd7}.boks.ok{background:#dcebdf}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="/stil.css">
</head>
<body>
<main>
  <span class="merk">Kirkelydpakken · Danbolt</span>
  <h1 id="tittel">Skjermbilde av styringspanelet</h1>
  <p class="dempet" id="intro">Henter …</p>
  <div class="boks feil" id="feil" hidden role="alert"></div>
  <div id="skjema" hidden style="display:flex;flex-direction:column;gap:18px;align-items:flex-start">
    <label class="velg"><span id="velgtekst">Velg skjermbilde eller ta bilde</span><input type="file" id="fil" accept="image/*"></label>
    <img id="vis" alt="Valgt bilde" hidden>
    <button id="send" type="button" hidden>Last opp</button>
    <div class="boks" id="status" role="status" hidden></div>
  </div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var del = decodeURIComponent(location.hash.slice(1)).split('.'), hode = { 'x-kirke': del[0], 'x-nokkel': del[1] }, b64 = '';
  function feil(t) { $('intro').hidden = true; $('skjema').hidden = true; $('feil').textContent = t; $('feil').hidden = false; }
  function status(t, klasse) { var s = $('status'); s.textContent = t; s.className = 'boks ' + (klasse || ''); s.hidden = false; }
  if (!del[0] || !del[1]) return feil('Denne siden åpnes med lenken du har fått fra Danbolt.');
  fetch('/api/panel', { headers: hode }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.feil); return j; }); }).then(function (j) {
    document.title = j.navn + ' – skjermbilde av styringspanelet';
    $('tittel').textContent = j.navn;
    $('intro').textContent = 'Last opp et skjermbilde av styringspanelet slik det ser ut i kirken. Et skjermbilde tatt på selve panelet er best. Et foto rett forfra, uten gjenskinn, går også.' + (j.harBilde ? ' Det ligger allerede et bilde inne. Et nytt bilde erstatter det.' : '');
    $('skjema').hidden = false;
  }).catch(function (e) { feil(e.message || 'Fikk ikke kontakt. Prøv igjen om litt.'); });

  $('fil').addEventListener('change', function () {
    var f = $('fil').files[0]; if (!f) return;
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      var k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var data = c.toDataURL('image/jpeg', 0.9); b64 = data.split(',')[1];
      $('vis').src = data; $('vis').hidden = false; $('send').hidden = false; $('velgtekst').textContent = 'Velg et annet bilde'; $('status').hidden = true;
    };
    img.onerror = function () { status('Klarte ikke å lese bildet. Prøv et JPEG- eller PNG-bilde.', 'feil'); };
    img.src = url;
  });
  $('send').addEventListener('click', function () {
    $('send').disabled = true; status('Laster opp …');
    fetch('/api/panel', { method: 'POST', headers: Object.assign({ 'content-type': 'application/json' }, hode), body: JSON.stringify({ data: b64 }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.feil); return j; }); })
      .then(function () { status('Takk! Bildet er lastet opp.', 'ok'); $('send').hidden = true; })
      .catch(function (e) { status((e.message || 'Opplastingen feilet.') + ' Prøv igjen.', 'feil'); })
      .then(function () { $('send').disabled = false; });
  });
})();
</script>
</body>
</html>
